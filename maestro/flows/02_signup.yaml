appId: steve.kurien.claude-automate
---
# Env: EMAIL, PASSWORD, FIRST, LAST (injected by run_suite.sh)
# Onboarding welcome screen → pick Create an account (goes straight to the form).
- tapOn:
    text: "Create an account"
# Intermediate screen: SSO buttons + "Sign up with email" link.
- extendedWaitUntil:
    visible: "Sign up with email"
    timeout: 15000
- tapOn:
    text: "Sign up with email"
# Email form animates in; give it a beat.
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    below: "First name*"
- inputText: ${FIRST}

- tapOn:
    below: "Last name*"
- inputText: ${LAST}

- tapOn:
    below: "Email address*"
- inputText: ${EMAIL}

- tapOn:
    below: "Password (8+ characters)*"
- inputText: ${PASSWORD}
- pressKey: Enter

- tapOn:
    text: "Continue"

# iOS system Save Password dialog — dismiss.
- tapOn:
    text: "Not Now"
    optional: true

# Interstitial "Let's build your garage" screen — tap through it.
- extendedWaitUntil:
    visible: "Add my car"
    timeout: 30000
- tapOn:
    text: "Add my car"

# Wait for the Add Vehicle screen.
- extendedWaitUntil:
    visible: "Add Vehicle"
    timeout: 15000
